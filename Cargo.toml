[package]
name = "chess-puzzles-bevy"
version = "1.0.0"
edition = "2024"
license = "MIT"

[dependencies]
bevy = "0.20.0"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1 # bevy is unusable at opt-level 0

[profile.dev.package."*"]
opt-level = 3
